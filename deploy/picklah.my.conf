# Bootstrap HTTP site. Certbot adds HTTPS during initial server setup.
server {
    listen 80;
    listen [::]:80;
    server_name picklah.my www.picklah.my;
    root /opt/picklah/current/dist;
    index index.html;
    client_max_body_size 3m;

    # Use one canonical host. Keep this rule in the HTTPS block after Certbot.
    if ($host = www.picklah.my) {
        return 301 https://picklah.my$request_uri;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        return 301 /$is_args$args;
    }
    location ~ "^/w/[A-Za-z0-9_-]{22}/?$" {
        # Serve the SPA directly, retaining these headers (no internal redirect).
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
